<!doctype html><meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#f5f5f7;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:0 78px;position:relative;overflow:hidden;color:#14141b}
  .glow{position:absolute;z-index:0;width:720px;height:720px;right:-220px;top:-240px;border-radius:50%;
        background:radial-gradient(circle,#fbe0dc 0%,rgba(245,245,247,0) 70%)}
  .brand,h1,p,.row{position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:27px;letter-spacing:-.02em;margin-bottom:34px}
  .brand i{width:46px;height:46px;border-radius:12px;background:#d93a2b;display:block;position:relative}
  .brand i::after{content:"";position:absolute;inset:11px 13px;background:#fff;border-radius:3px}
  h1{font-size:71px;line-height:1.04;letter-spacing:-.035em;font-weight:800;max-width:940px}
  h1 em{font-style:normal;color:#d93a2b}
  p{margin-top:24px;font-size:29px;color:#4b4d5a;max-width:840px;line-height:1.4}
  .row{display:flex;gap:11px;margin-top:38px;flex-wrap:wrap}
  .chip{border:1px solid #d7d8e0;background:#fff;border-radius:99px;padding:11px 21px;font-size:21px;font-weight:600;color:#4b4d5a}
  .chip b{color:#12764f}
</style>
<div class="glow"></div>
<div class="brand"><i></i> PDF sin Registro</div>
<h1>Unir, comprimir y editar PDF <em>sin que salgan de tu ordenador</em></h1>
<p>Todo se procesa en tu navegador. Sin registro, sin marca de agua y con descarga directa.</p>
<div class="row">
  <span class="chip"><b>✓</b> Sin registro</span>
  <span class="chip"><b>✓</b> Sin marca de agua</span>
  <span class="chip"><b>✓</b> 100 % privado</span>
  <span class="chip"><b>✓</b> Gratis</span>
</div>
